name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm --prefix ui ci
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path src-tauri/target/release/vdesigner.exe -DestinationPath vdesigner-portable-windows-x64.zip

      - name: Compute checksums
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse -Filter *.msi src-tauri/target/release/bundle
          Get-FileHash $msi.FullName -Algorithm SHA256 | Format-List | Out-File checksums.txt
          Get-FileHash vdesigner-portable-windows-x64.zip -Algorithm SHA256 | Format-List | Out-File -Append checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            vdesigner-portable-windows-x64.zip
            checksums.txt
