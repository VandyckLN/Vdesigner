name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # O rav1e, dentro do ravif, monta suas rotinas de AVIF em assembly e não
      # compila sem o montador.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - run: npm --prefix ui ci
      - run: cargo install tauri-cli --version "^2" --locked

      # Falha aqui, antes dos ~15 minutos de build, em vez de terminar
      # silenciosamente com um instalador sem .sig que o script de liberação
      # vai recusar para sempre.
      - name: Verificar o segredo de assinatura
        shell: pwsh
        run: |
          if (-not "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}") {
            throw "TAURI_SIGNING_PRIVATE_KEY não está configurado; a release sairia sem assinatura."
          }

      - name: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/vdesigner.exe -DestinationPath vdesigner-portable-windows-x64.zip

      - name: Compute checksums
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Recurse -Filter *-setup.exe target/release/bundle/nsis
          Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List | Out-File checksums.txt
          Get-FileHash vdesigner-portable-windows-x64.zip -Algorithm SHA256 | Format-List | Out-File -Append checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            vdesigner-portable-windows-x64.zip
            checksums.txt
