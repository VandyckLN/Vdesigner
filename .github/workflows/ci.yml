name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # A versão vai no nome da ref; `@master` não passa toolchain nenhuma e a
      # action aborta com "'toolchain' is a required input".
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # O rav1e, dentro do ravif, monta suas rotinas de AVIF em assembly e não
      # compila sem o montador.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run lint
      - run: npm --prefix ui run test
      # Testa scripts/liberar.mjs com node:test puro; sem dependências, não
      # precisa de instalação na raiz. Roda via package.json para não duplicar
      # o padrão de glob em dois lugares.
      - run: npm run test:scripts
